server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS (127.0.0.11) + a variable in proxy_pass forces
    # nginx to re-resolve "backend" on every request instead of caching the
    # IP once at worker startup. Without this, recreating the backend
    # container on any redeploy leaves nginx pointing at a dead IP ("no live
    # upstreams") until someone manually restarts this frontend container —
    # a plain `proxy_pass http://backend:3000` literal does NOT re-resolve.
    resolver 127.0.0.11 valid=10s;

    # Proxy API calls to the backend service (Docker Compose service name).
    # NOTE: proxy_pass has NO trailing URI here on purpose — when the target
    # is a variable, nginx does not strip the `/api/` location prefix the
    # way it would with a literal proxy_pass, so a trailing `/api/` here
    # would double it (`/api//api/...` -> 404). Passing the original,
    # untouched request URI through is exactly right anyway: the backend's
    # own routes already live under `/api/*`.
    location /api/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — react-router handles client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
